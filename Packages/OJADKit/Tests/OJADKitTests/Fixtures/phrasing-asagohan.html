<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"></head>
<body>
<div id="phrasing_main" class="ojad_dropshadow_standalone">
    <div class="synthesis_synthesis_button phrasing_edit_link clear" style="margin:5px">
        <font size="2">
        話速        </font>
        <select id="speech_rate_mode" name="speech_rate_mode" onChange="linked(this)">
        <option value='1'>Normal</otpion>
        <option value='2'>Slow</otpion>
        <option value='3'>Fast</otpion>
        </select>
    </div>
    <div class="synthesis_synthesis_button phrasing_edit_link clear" style="margin:5px">
        <font size="2">
        話者        </font>
        <select id="speaker" name="speaker" onChange="linked(this)">
        <option value='fa001'>F1</otpion>
        <option value='fb001'>F2</otpion>
        <option value='ma003'>M1</otpion>
        <option value='mb001'>M2</otpion>
        </select>
    </div>

<div class="phrasing_edit_link clear">
     <div class="submit">
            <input type="button" value="印字" onclick="$('#PhrasingPublishIndexForm').submit(); return false;"/>
     </div>
</div>
    <div class="synthesis_save_button phrasing_edit_link clear">
        <div class="submit"><input type="button" value="保存" onclick="wav_filename_save(); return false;"/></div>
    </div>
    <div class="synthesis_play_button phrasing_edit_link clear">
        <div class="submit"><input type="button" value="再開" onclick="audio_global_resume(); return false;"/></div>
    </div>
    <div class="synthesis_play_button phrasing_edit_link clear">
        <div class="submit"><input type="button" value="停止" onclick="audio_global_pause(); return false;"/></div>
    </div>
    <div class="synthesis_play_button phrasing_edit_link clear">
        <div class="submit"><input type="button" value="再生" onclick="wav_filename_play(); return false;"/></div>
    </div>
    <div class="synthesis_synthesis_button phrasing_edit_link clear">
        <div class="submit"><input type="button" value="作成" onclick="synthesis_and_get_filename(); return false;"/></div>
    </div>

    <div class="phrasing_row_wrapper clearfix">
                                                        <div class="phrasing_phrase_wrapper">
                        
                                                        <div class="phrasing_accent_curve">
                                <canvas id="#phrase_0_0" width="10" height="20"></canvas>
                            </div>

                            <script type="text/javascript">
                                $(function () { set_accent_curve_phrase('#phrase_0_0',15,[0,1,1,0,0,0,0,2,0,0,0,0,3,3,3],1,0,0);                                });
                            </script>
                                                
                            <div class="phrasing_text">
                                <span class="mola_0"><span class="inner"><span class="char">あ</span></span></span><span class="accent_plain mola_1"><span class="inner"><span class="char">さ</span></span></span><span class="accent_top mola_2"><span class="inner"><span class="char">ご</span></span></span><span class="mola_3"><span class="inner"><span class="char">は</span></span></span><span class="mola_4"><span class="inner"><span class="char">ん</span></span></span><span class="mola_5"><span class="inner"><span class="char">を</span></span></span><span class="mola_6"><span class="inner"><span class="char">た</span></span></span><span class="accent_top mola_7"><span class="inner"><span class="char">べ</span></span></span><span class="mola_8"><span class="inner"><span class="char">る</span></span></span><span class="mola_9"><span class="inner"><span class="char">の</span></span></span><span class="mola_10"><span class="inner"><span class="char">を</span></span></span><span class="mola_11"><span class="inner"><span class="char">わ</span></span></span><span class="accent_plain mola_12"><span class="inner"><span class="char">す</span></span></span><span class="accent_plain mola_13"><span class="inner"><span class="char">れ</span></span></span><span class="accent_plain mola_14"><span class="inner"><span class="char">た</span></span></span><span class="inner endmark"><span class="char">。</span></span>                            </div>

			    			    <div class="phrasing_subscript">
			      <span>朝ご飯を食べるのを忘れた</span><span class="inner endmark"><span class="char">。</span></span>			    </div>
			                                                </div>
                                        </div>
    <div class="phrasing_row_wrapper clearfix">
                    <div class="phrasing_phrase_wrapper"></div>
            </div>
    <div class="phrasing_row_wrapper clearfix">
                    <div class="phrasing_phrase_wrapper"></div>
            </div>
</div>
</body>
</html>
