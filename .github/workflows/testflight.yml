name: TestFlight

# Builds, signs and uploads to TestFlight on every push to main.
# Skips cleanly until the four secrets below exist (see docs/testflight-setup.md).
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - docs/**
      - .agents/**
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  check-secrets:
    name: Check signing secrets
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=TestFlight upload skipped::Missing repository secrets: ${missing[*]}. See docs/testflight-setup.md."
          fi

  upload:
    name: Archive, sign and upload
    needs: check-secrets
    if: needs.check-secrets.outputs.ready == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'io.github.umasteas.ojad' }}
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd App && xcodegen generate

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key_dir="$RUNNER_TEMP/private_keys"
          mkdir -p "$key_dir"
          key_path="$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          # Accept the .p8 file contents as-is, or base64 of it.
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8" > "$key_path"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$key_path"
          fi
          chmod 600 "$key_path"
          grep -q "BEGIN PRIVATE KEY" "$key_path" || { echo "::error::ASC_KEY_P8 is not a .p8 private key"; exit 1; }
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Compute build number
        run: echo "BUILD_NUMBER=$(( ${{ github.run_number }} * 10 + ${{ github.run_attempt }} ))" >> "$GITHUB_ENV"

      # Unsigned on purpose: signing at archive time would mint a new Apple
      # Development certificate on every ephemeral runner (and needs a registered
      # device). Export below signs with the cloud-managed distribution certificate.
      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project App/OJAD.xcodeproj \
            -scheme OJAD \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/OJAD.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OJAD_BUNDLE_ID="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | xcbeautify --renderer github-actions

      - name: Write export options
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><true/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          plutil -lint build/ExportOptions.plist

      - name: Sign and upload to App Store Connect
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/OJAD.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | xcbeautify --renderer github-actions
          echo "::notice title=Uploaded to TestFlight::$BUNDLE_ID build $BUILD_NUMBER. Apple processes it for ~5–30 minutes before it appears in TestFlight."

      - name: Upload export logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: export-logs
          path: |
            build/export/*.log
            build/export/*.plist
            ${{ runner.temp }}/*.xcdistributionlogs
          if-no-files-found: ignore

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys"
